<!doctype html><html><head><style>body{margin:0;background:#111;color:white;font:16px Arial}nav{position:fixed;top:12px;left:12px;z-index:2}button{padding:12px;margin:4px}canvas{display:block}#status{padding:6px}</style></head><body><nav><button id="entry">Long entry</button><button id="pit">Pit sponsors</button><button id="atlas">Sponsor atlas</button><span id="status">Loading world…</span></nav><script type="module">
import * as THREE from 'three';import {createWorld} from '/src/world.js';import {loadSponsorMaterial} from '/src/sponsors.js';
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,1800);await createWorld(scene,renderer);let picture;
function entry(){if(picture)picture.remove();renderer.domElement.style.display='block';camera.position.set(300,120,-285);camera.lookAt(221,0,-178);renderer.render(scene,camera)}
function pit(){if(picture)picture.remove();renderer.domElement.style.display='block';camera.position.set(217,9,-142);camera.lookAt(231,2,-98);renderer.render(scene,camera)}
document.querySelector('#entry').onclick=entry;document.querySelector('#pit').onclick=pit;document.querySelector('#atlas').onclick=async()=>{const m=await loadSponsorMaterial();picture=document.createElement('img');picture.src=m.map.image.toDataURL();picture.style='width:640px;margin:70px auto 0;display:block';renderer.domElement.style.display='none';document.body.append(picture)};document.querySelector('#status').textContent='110 m entry · 12 fictional sponsors';entry();
</script></body></html>
