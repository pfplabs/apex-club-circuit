<!doctype html><html><head><meta charset="utf-8"><title>Braking board approach inspection</title><style>body{margin:0;background:#8eb1c4}nav{position:fixed;top:16px;left:16px;background:white;padding:12px;font:16px Arial;z-index:1}button{padding:8px}</style></head><body><nav>Braking boards · approach view <button id="next">Next braking zone</button></nav><script type="module">
import * as THREE from 'three';import {addBrakingBoards,BRAKING_ENTRIES} from '../src/braking-boards.js';import {track} from '../src/course.js';import {createWorld} from '../src/world.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#8eb1c4');scene.add(new THREE.HemisphereLight(0xffffff,0x405432,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(80,150,20);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,2000);const controls=new OrbitControls(camera,renderer.domElement);const world=await createWorld(scene,renderer,{assetBase:'/assets/'});const boards=world.brakingDetails.boards;
let zone=0;function view(){const p=boards.placements[zone*3],a=track[p.segment];camera.position.set(a.x-Math.sin(p.heading)*22,a.y+2.6,a.z-Math.cos(p.heading)*22);controls.target.set(p.x,p.y+2.4,p.z);controls.update();}view();document.querySelector('button').onclick=()=>{zone=(zone+1)%3;view()};renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
