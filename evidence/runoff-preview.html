<!doctype html><html><head><style>body{margin:0}nav{position:fixed;top:10px;left:10px;background:#fff;padding:10px;font:16px sans-serif}button{margin:4px}</style></head><body><nav id="nav">Corner spectator areas</nav><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
